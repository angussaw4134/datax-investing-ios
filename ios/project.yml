name: DataXInvesting
options:
  bundleIdPrefix: com.datax
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '5'
    CODE_SIGN_STYLE: Automatic
targets:
  DataXInvesting:
    type: application
    platform: iOS
    sources:
      - MonitorApp
      - path: DataXInvesting/Assets.xcassets
      - path: DataXInvesting/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datax.investing
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - DataXMonitorTests
  DataXMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MonitorTests
    dependencies:
      - target: DataXInvesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.datax.investing.tests
